# On every push to main: build the site and publish the finished files to the "hostinger" branch.
# Hostinger's Git deployment then copies that branch into public_html.
name: Build for Hostinger
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'tests/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: hostinger-build, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - name: Build site (uses your published admin data when available)
        env:
          EXPORT_URL: ${{ secrets.EXPORT_URL }}
          BUILD_TOKEN: ${{ secrets.BUILD_TOKEN }}
        run: python3 build/build.py
      - run: python3 build/hostinger.py
      - name: Publish to hostinger branch
        run: |
          cd dist-hostinger
          git init -q -b hostinger
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" hostinger
